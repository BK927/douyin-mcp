[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bk927-douyin-mcp"
version = "0.1.0"
description = "Douyin MCP: scoped official APIs and an optional visible-page browser reader"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "BK927"}]
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
douyin-mcp = "douyin_mcp.server:main"
douyin-auth = "douyin_mcp.auth:main"
douyin-browser-login = "douyin_mcp.browser:login_main"

[project.urls]
Repository = "https://github.com/BK927/douyin-mcp"
Issues = "https://github.com/BK927/douyin-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["douyin_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/douyin_mcp", "/tests", "/README.md", "/SECURITY.md", "/LICENSE", "/.env.example", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
